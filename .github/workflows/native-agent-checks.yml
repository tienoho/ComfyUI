name: Native Comfy Agent host probe

on:
  pull_request:
    paths:
      - 'script_examples/check_native_agent.py'
      - 'tests-unit/native_agent_panel_check_test.py'
      - 'NATIVE_AGENT_PANEL.md'
      - '.github/workflows/native-agent-checks.yml'
  push:
    branches:
      - feat/chat-agent-workflow-automation
    paths:
      - 'script_examples/check_native_agent.py'
      - 'tests-unit/native_agent_panel_check_test.py'
      - 'NATIVE_AGENT_PANEL.md'
      - '.github/workflows/native-agent-checks.yml'

permissions:
  contents: read

jobs:
  native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile native probe
        run: python -m py_compile script_examples/check_native_agent.py
      - name: Verify official feature and route contract
        run: python -m pytest -q tests-unit/native_agent_panel_check_test.py
