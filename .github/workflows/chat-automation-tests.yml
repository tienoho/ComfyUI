name: Chat Automation contract tests

on:
  pull_request:
    paths:
      - 'custom_nodes/comfyui_agent_automation/**'
      - 'tests-unit/agent_automation_test.py'
      - 'tests-unit/agent_automation_routes_test.py'
      - '.github/workflows/chat-automation-tests.yml'
  push:
    branches:
      - feat/chat-agent-workflow-automation
    paths:
      - 'custom_nodes/comfyui_agent_automation/**'
      - 'tests-unit/agent_automation_test.py'
      - 'tests-unit/agent_automation_routes_test.py'
      - '.github/workflows/chat-automation-tests.yml'

permissions:
  contents: read

jobs:
  registry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest aiohttp
      - name: Validate Python syntax
        run: python -m compileall -q custom_nodes/comfyui_agent_automation
      - name: Validate frontend JavaScript syntax
        run: node --input-type=module --check < custom_nodes/comfyui_agent_automation/web/automation.js
      - name: Run CPU-only validation tests
        run: python -m pytest -q tests-unit/agent_automation_test.py tests-unit/agent_automation_routes_test.py

  fork-startup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Start actual fork and verify Chat Automation routes
        env:
          COMFY_AUTOMATION_TOKEN: ci-automation-smoke-token-32-characters
        run: |
          set -eu
          python main.py --cpu --disable-auto-launch --disable-all-custom-nodes --whitelist-custom-nodes comfyui_agent_automation > /tmp/comfy-automation-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8188"
          token = os.environ["COMFY_AUTOMATION_TOKEN"]

          def request(path, data=None, auth=True):
              headers = {}
              if auth:
                  headers["Authorization"] = "Bearer " + token
              if data is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(data).encode("utf-8")
              req = urllib.request.Request(base + path, headers=headers, data=data)
              with urllib.request.urlopen(req, timeout=5) as response:
                  return json.loads(response.read())

          for attempt in range(120):
              try:
                  catalog = request("/comfy-automation/v1/workflows")
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise RuntimeError("Actual fork failed to load automation API in 120 seconds")

          assert any(item["id"] == "text-to-image" for item in catalog["workflows"])
          plan = request("/comfy-automation/v1/chat", {"message": "A sunrise over the bay"})
          assert plan["plan_id"] and plan["session_id"]
          assert plan["plan"]["workflow_id"] == "text-to-image"
          assert len(plan["template_revision"]) == 64
          spec = request("/comfy-automation/v1/openapi.json")
          assert spec["openapi"] == "3.1.0"
          extensions = request("/extensions", auth=False)
          assert any("comfyui_agent_automation" in item for item in extensions)
          print("Actual fork startup, chat planning, OpenAPI and UI registration: PASS")
          PY
          then
            tail -n 120 /tmp/comfy-automation-smoke.log
            exit 1
          fi
